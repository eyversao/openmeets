<!doctype html><meta charset="utf-8"><title>OpenMeets · banner del README</title><style>
/* Banner 2000×516 del README, uno por idioma (?l=en|es|zh&d=<dominio>). Se captura con fondo transparente para las esquinas redondas.
   Tipos de la marca: Geist (texto), Geist Mono (datos), Instrument Serif italic (acento); chino: Smiley Sans. */
@font-face{font-family:Geist;font-weight:500;src:url(../../web/fuentes/geist-latin-500-normal.woff2)}
@font-face{font-family:Geist;font-weight:600;src:url(../../web/fuentes/geist-latin-600-normal.woff2)}
@font-face{font-family:GeistMono;font-weight:500;src:url(../../web/fuentes/geist-mono-latin-500-normal.woff2)}
@font-face{font-family:Titular;font-style:italic;src:url(../../web/fuentes/instrument-serif-latin-400-italic.woff2)}
@font-face{font-family:Hanzi;src:url(fuentes/smiley-sans-oblique.woff2)}
:root{--tinta:#0B0B0A;--papel:#F2F2EE;--gris:#8E8E88;--linea:rgba(255,255,255,.09);--senal:#D9F84A;--ui:Geist,"Microsoft YaHei",sans-serif;--mono:GeistMono,ui-monospace,monospace}
html,body{margin:0;background:transparent}
body{width:2000px;height:516px;font-family:var(--ui);color:var(--papel)}
#lienzo{position:absolute;inset:0;border-radius:28px;overflow:hidden;background:
  radial-gradient(900px 520px at 1520px 40px,rgba(255,255,255,.075),transparent 70%),
  radial-gradient(700px 360px at 1480px 600px,rgba(217,248,74,.05),transparent 70%),
  linear-gradient(180deg,#121211,#0A0A09)}
#rejilla{position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,var(--linea) 0 1px,transparent 1px 80px),
  repeating-linear-gradient(0deg,var(--linea) 0 1px,transparent 1px 80px);
  -webkit-mask:radial-gradient(760px 420px at 1500px 250px,#000 10%,transparent 75%);opacity:.55}
#borde{position:absolute;inset:0;border-radius:28px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08)}
.a{position:absolute}
#logo{left:112px;top:70px;height:44px}
#titular{left:108px;top:166px;font:500 100px/1.04 var(--ui);letter-spacing:-.045em;white-space:nowrap}
#titular i{font:italic 400 116px/1 Titular;letter-spacing:-.01em;color:var(--tinta);background:linear-gradient(transparent 12%,var(--senal) 12% 90%,transparent 90%);padding:0 .1em;margin:0 -.02em}
.zh #titular{font:104px/1.12 Hanzi;letter-spacing:.02em}
.zh #titular i{font:104px/1.12 Hanzi;letter-spacing:.02em}
#pie{left:112px;bottom:64px;display:flex;gap:22px;align-items:center;font:500 27px/1 var(--ui);color:var(--gris);letter-spacing:-.01em}
#pie b{color:var(--papel);font-weight:500}
#pie .p{width:6px;height:6px;border-radius:50%;background:#4A4A45}
#escena{left:1040px;top:0;width:960px;height:516px}
#reflejo{left:1040px;top:0;width:960px;height:516px;transform:scaleY(-1);transform-origin:0 376px;opacity:.16;-webkit-mask:linear-gradient(180deg,transparent 60%,#000 76%,transparent 94%)}
#suelo{left:1080px;right:40px;top:376px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)}
#vivo{left:1110px;top:76px;display:flex;align-items:center;gap:14px;font:500 20px/1 var(--mono);letter-spacing:.1em;color:var(--gris)}
#vivo .pill{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 14px;border-radius:999px;background:rgba(229,53,43,.14);color:#FF8A80;box-shadow:inset 0 0 0 1px rgba(229,53,43,.35)}
#vivo .pill::before{content:"";width:10px;height:10px;border-radius:50%;background:#FF4B3E;box-shadow:0 0 12px #FF4B3E}
#peso{right:112px;top:56px;text-align:right;font:600 86px/1 var(--ui);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
#peso small{font:500 30px var(--mono);color:var(--gris);letter-spacing:0;margin-left:8px}
#luces{left:1444px;top:420px;display:flex;gap:30px}
.luz{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 50% 42%,#FFF 0 46%,#ECECE6 72%,#CFCFC8);box-shadow:0 0 0 4px #1B1B19,0 0 0 5px #2E2E2B,0 0 26px 6px rgba(255,255,255,.45),0 0 70px 20px rgba(255,255,255,.12)}
#record{right:112px;top:158px;display:flex;align-items:center;gap:14px;padding:8px 20px 8px 8px;border-radius:999px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
#record i{font:italic 400 34px/1 Titular;color:var(--tinta);background:var(--senal);padding:4px 12px 6px;border-radius:999px}
.zh #record i{font:28px/1.2 Hanzi;font-style:normal}
#record span{font:500 21px/1 var(--mono);color:var(--gris);letter-spacing:.06em}
</style>
<div id="lienzo">
  <div id="rejilla"></div>
  <svg id="reflejo" class="a" viewBox="0 0 960 516"></svg>
  <div id="suelo" class="a"></div>
  <svg id="escena" class="a" viewBox="0 0 960 516"></svg>
  <img id="logo" class="a" src="../logotipo-blanco.svg" alt="">
  <div id="titular" class="a"></div>
  <div id="pie" class="a"></div>
  <div id="vivo" class="a"><span class="pill" data-t="vivo"></span><span data-t="intento"></span></div>
  <div id="peso" class="a">215<small>kg</small></div>
  <div id="luces" class="a"><b class="luz"></b><b class="luz"></b><b class="luz"></b></div>
  <div id="record" class="a"><i data-t="record"></i><span data-t="recordSub"></span></div>
  <div id="borde"></div>
</div>
<script src="escenario.js"></script>
<script>
const TEXTOS = {
  en: { titular: ['Powerlifting meets,', 'live and <i>open</i>.'], vivo: 'LIVE', intento: 'SQUAT · 3RD ATTEMPT',
        record: 'New record', recordSub: '3/3', pie: ['MIT', 'Web + Windows', 'Works offline'] },
  es: { titular: ['Powerlifting en vivo,', 'libre y <i>abierto</i>.'], vivo: 'EN VIVO', intento: 'SENTADILLA · 3.ER INTENTO',
        record: 'Nuevo récord', recordSub: '3/3', pie: ['MIT', 'Web + Windows', 'Sin internet'] },
  zh: { titular: ['力量举比赛，', '实时、<i>开源</i>。'], vivo: '直播', intento: '深蹲 · 第三次试举',
        record: '新纪录', recordSub: '3/3', pie: ['MIT', '网页版 + Windows', '无需联网'] },
};
const q = new URLSearchParams(location.search), L = q.get('l') || 'en', T = TEXTOS[L];
document.body.classList.toggle('zh', L === 'zh'); document.documentElement.lang = L;
document.querySelectorAll('[data-t]').forEach(e => e.textContent = T[e.dataset.t]);
document.getElementById('titular').innerHTML = T.titular.join('<br>');
const dominio = q.get('d') || 'openmeets.web.app';
document.getElementById('pie').innerHTML = [`<b>${dominio}</b>`, ...T.pie].join('<span class="p"></span>');
// Barra cargada (215 kg) apoyada en el suelo, con su reflejo.
for (const [id, sel] of [['e', '#escena'], ['r', '#reflejo']]) barra(document.querySelector(sel), { cx: 500, cy: 300, largo: 820, k: .86, id });
</script>
