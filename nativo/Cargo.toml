[package]
name = "openmeets"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
bytes = "1.12.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
enable-ansi-support = "0.3.1"
flate2 = "1.1.11"
futures-util = "0.3.34"
hex = "0.4.3"
if-addrs = "0.15.0"
indexmap = "2.14.2"
qrcode = { version = "0.15.0", default-features = false }
rand = "0.10.4"
rust-embed = { version = "8.14.0", features = ["debug-embed"] }
scrypt = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "signal", "time", "sync", "process", "io-util", "fs"] }
unicode-normalization = "0.1.26"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
